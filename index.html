<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacra · Nel Labirinto Antico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&amp;display=swap">
<link rel="stylesheet" href="./style.css?v=24">
<main id="title-screen" aria-labelledby="game-title">
  <div class="title-brand">
    <div class="title-seal" aria-hidden="true">
      <span class="seal-spark"></span>
      <span class="seal-spark"></span>
      <span class="seal-spark"></span>
      <span class="seal-spark"></span>
      <span class="seal-spark"></span>
    </div>
    <h1 id="game-title">Simulacra</h1>
    <p class="title-subtitle">Nel Labirinto Antico</p>
  </div>
  <ul class="title-cast" aria-label="I quattro Simulacri">
    <li><img src="./sprites/mage-0-earth.png?v=7" alt="Simulacro di Terra rosso"></li>
    <li><img src="./sprites/mage-0-lightning.png?v=7" alt="Simulacro di Fulmine rosso"></li>
    <li><img src="./sprites/mage-1-earth.png?v=7" alt="Simulacro di Terra blu"></li>
    <li><img src="./sprites/mage-1-lightning.png?v=7" alt="Simulacro di Fulmine blu"></li>
  </ul>
  <nav class="title-menu" aria-label="Modalità di gioco">
    <button id="start-local" type="button">
      <span>Giocatore vs Giocatore</span><span class="title-menu-aside" aria-hidden="true">→</span>
      <small>Due giocatori sullo stesso dispositivo</small>
    </button>
    <button id="start-solo" type="button">
      <span>Giocatore vs Computer</span><span class="title-menu-aside" aria-hidden="true">→</span>
      <small>Affronta il computer in solitaria</small>
    </button>
    <button id="start-spectator" type="button">
      <span>Computer vs Computer</span><span class="title-menu-aside" aria-hidden="true">→</span>
      <small>Osserva due avversari automatici</small>
    </button>
  </nav>
  <form id="computer-setup" class="computer-setup" hidden>
    <h2 id="computer-mode"></h2>
    <label id="side-setting">Il tuo Arcimago
      <select id="human-side"><option value="0">Rosso</option><option value="1">Blu</option></select>
    </label>
    <label><span id="level-label">Difficoltà</span>
      <select id="computer-level"><option value="easy">Facile</option><option value="normal" selected>Normale</option><option value="hard">Difficile</option></select>
    </label>
    <label id="blue-setting">Difficoltà del Blu
      <select id="blue-level"><option value="easy">Facile</option><option value="normal" selected>Normale</option><option value="hard">Difficile</option></select>
    </label>
    <div><button type="submit">Inizia partita</button> <button type="button" id="cancel-setup">Indietro</button></div>
  </form>
</main>
<header id="match-header" hidden>
  <h1>Simulacra</h1>
  <div id="turn" role="status" tabindex="-1"></div>
  <div id="spectator-controls" hidden>
    <button id="toggle-computers" type="button">Avvia</button>
    <button id="step-computers" type="button">Avanza di una decisione</button>
    <label>Velocità
      <select id="computer-speed"><option value="1000">Lenta</option><option value="550" selected>Normale</option><option value="120">Rapida</option></select>
    </label>
  </div>
  <details class="match-menu"><summary>Partita</summary><div class="match-menu-content">
  <button id="reset" type="button">Nuova partita</button>
  <button id="copy-match-log" type="button" hidden title="Il registro include le carte considerate nelle decisioni dei computer">Copia registro partita</button>
  <button id="main-menu" type="button">Menu principale</button>
  <details class="animation-settings"><summary>Animazioni</summary>
    <label>Ritmo <select id="animation-speed"><option value="1.5">Lento</option><option value="1" selected>Normale</option><option value="0.6">Rapido</option></select></label>
    <label><input id="reduce-motion" type="checkbox"> Riduci movimento</label>
  </details>
  </div></details>
</header>
<section id="action-caption" class="action-caption" aria-label="Ultima azione"></section>
<p id="route-caption" class="route-caption" role="status"></p>
<textarea id="match-log-export" aria-label="Registro della partita da copiare" readonly rows="10" cols="75" hidden></textarea>
<main id="game" hidden></main>
<section id="match-history" class="match-history" aria-label="Cronologia della partita" hidden></section>
<aside id="context-detail" class="context-detail" role="dialog" aria-label="Dettagli" hidden>
  <button id="close-detail" type="button" aria-label="Chiudi dettagli">Chiudi ×</button>
  <p id="detail-content"></p>
</aside>
<script type="module" src="./game.mjs?v=13"></script>
</html>
